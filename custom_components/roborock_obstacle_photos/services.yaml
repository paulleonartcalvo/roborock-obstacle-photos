mark_path:
  fields:
    name:
      required: true
      example: litter_box
      selector:
        text:
    job:
      example: "{{ states('sensor.qrevo_edge_3_pro_last_clean_begin') }}"
      selector:
        text:
    vacuum:
      selector:
        text:
path_crossed:
  fields:
    name:
      required: true
      example: litter_box
      selector:
        text:
    zone:
      required: true
      example: "[28193, 20548, 30168, 22128]"
      selector:
        object:
    job:
      example: "{{ states('sensor.qrevo_edge_3_pro_last_clean_begin') }}"
      selector:
        text:
    reach:
      default: 125
      selector:
        number:
          min: 10
          max: 1000
          unit_of_measurement: mm
    min_coverage:
      default: 0.8
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    vacuum:
      selector:
        text:
